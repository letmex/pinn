name: torch_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - numpy=1.23.5
  - matplotlib=3.7.1
  - pillow=11.0.0
  - absl-py=2.1.0
  - colorama=0.4.6
  - contourpy=1.3.0
  - cycler=0.12.1
  - filelock=3.16.1
  - fonttools=4.54.1
  - grpcio=1.67.1
  - importlib_metadata=8.5.0
  - importlib_resources=6.4.5
  - jinja2=3.1.4
  - kiwisolver=1.4.7
  - markupsafe=3.0.2
  - mpmath=1.3.0
  - networkx=3.2.1
  - packaging=24.2
  - protobuf=5.28.3
  - pyparsing=3.2.0
  - python-dateutil=2.9.0
  - six=1.16.0
  - sympy=1.13.3
  - tensorboard=2.18.0
  - tqdm=4.65.0
  - typing_extensions=4.12.2
  - werkzeug=3.1.3
  - zipp=3.21.0

  # GPU-accelerated PyTorch
  - pytorch=2.0.1
  - pytorch-cuda=11.8

  # Use pip for packages not available in conda-forge/pytorch channels
  - pip
  - pip:
    - gmshparser==0.2.0
    - tensorboard-data-server==0.7.2
    - markdown==3.7
